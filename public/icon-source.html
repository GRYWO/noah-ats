<!doctype html>
<html><head><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; }
  .icon {
    width: 512px; height: 512px;
    background: #333399;
    display: flex; align-items: center; justify-content: center;
    border-radius: 96px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .letter {
    color: #ffffff;
    font-size: 340px;
    font-weight: 900;
    letter-spacing: -20px;
    line-height: 1;
    margin-right: 30px;
  }
  .dot {
    width: 50px; height: 50px;
    background: #ffd84d;
    border-radius: 50%;
    align-self: flex-end;
    margin-bottom: 100px;
  }
</style></head>
<body><div class="icon"><span class="letter">n</span><span class="dot"></span></div></body></html>
