<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Blauwe gradient van donker linksonder naar lichter rechtsboven -->
    <linearGradient id="grywoGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"  stop-color="#1f2bb0" />
      <stop offset="55%" stop-color="#2c5fd4" />
      <stop offset="100%" stop-color="#3a8de8" />
    </linearGradient>
  </defs>

  <!-- Vierkant met afgeronde hoeken -->
